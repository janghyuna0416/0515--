<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Camp | 당신의 감정을 분석하는 겨울 캠프</title>
    <meta name="description" content="인공지능이 당신의 하루와 감정을 따뜻하게 분석해드립니다.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    <main id="app">
        <header>
            <h1 id="title">Emotion Camp</h1>
            <p class="subtitle">눈 덮인 캠프에서 전하는 당신의 이야기</p>
        </header>

        <section class="card input-card">
            <textarea id="textInput" maxlength="500" placeholder="오늘 하루는 어떠셨나요? 당신의 감정을 들려주세요..."></textarea>
            <div class="input-footer">
                <span id="charCount">0/500</span>
                <button id="analyzeBtn">감정 분석하기</button>
            </div>
        </section>

        <section id="resultCard" class="card result-card hidden">
            <div class="result-header">
                <span class="label">분석 결과</span>
                <div id="sentimentBadge" class="badge">Positive</div>
            </div>
            <div class="result-body">
                <div class="confidence-container">
                    <div class="confidence-label">신뢰도</div>
                    <div class="progress-bar">
                        <div id="confidenceBar" class="progress"></div>
                    </div>
                    <span id="confidenceValue">90%</span>
                </div>
                <div class="reason-container">
                    <p id="reasonText">분석 결과가 여기에 표시됩니다.</p>
                </div>
            </div>
        </section>

        <div id="errorMessage" class="error-toast hidden"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
